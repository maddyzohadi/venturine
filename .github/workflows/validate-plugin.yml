name: Validate Venturine Plugin

on:
  push:
    paths:
      - ".claude-plugin/**"
      - "skills/**"
      - "agents/**"
      - ".github/workflows/validate-plugin.yml"
      - ".github/ci/**"
  # No path filter on pull requests: this check is required by the "Protect
  # main" ruleset, so it must report on every pull request, including
  # documentation-only changes.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Plugin and Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Claude Code (pinned, integrity-checked)
        # The lockfile pins every package by exact version and integrity
        # hash; npm ci fails on any mismatch. Scripts must stay enabled
        # because the CLI links its native binary in a postinstall step.
        working-directory: .github/ci/claude-code
        run: npm ci --no-audit --no-fund

      - name: Validate Venturine
        run: .github/ci/claude-code/node_modules/.bin/claude plugin validate . --strict
