name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests (Python ${{ matrix.python-version }})
    # Pinned to a specific image: ubuntu-latest moved to 26.04, which has no
    # prebuilt Python 3.9 in actions/python-versions (only 22.04 and 24.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version (3.9) and the newest releases.
        python-version: ["3.9", "3.11", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run calculator and repository tests
        run: python -m unittest discover -s tests -v
