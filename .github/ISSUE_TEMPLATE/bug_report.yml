name: Bug report
description: Something in Venturine does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not include real customer data, credentials or confidential business details. For security problems, do not use this form; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Prompts or commands, using hypothetical data only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Venturine version
      placeholder: "0.2.1"
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      placeholder: "output of `claude --version`"
  - type: input
    id: python
    attributes:
      label: Python version (if the calculator is involved)
      placeholder: "output of `python3 --version`"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Skill
        - Agent
        - Calculator
        - Documentation
        - CI or repository
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or error text
      description: Paste relevant output. Remove anything private.
      render: text
