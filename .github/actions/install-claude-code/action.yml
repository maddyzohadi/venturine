name: Install Claude Code CLI (pinned, integrity-checked)
description: >-
  Installs the Claude Code CLI at one exact version into a temporary folder
  outside the repository, refuses to run any install script until every
  installed package matches a pinned sha512 integrity hash, and then puts the
  CLI on PATH. To change the version, update every line of PINNED_PACKAGES.

runs:
  using: composite
  steps:
    - name: Install, verify, then run install scripts
      shell: bash
      env:
        # One line per package: name, exact version, sha512 integrity hash.
        # The hashes are the ones the former committed lockfile recorded.
        PINNED_PACKAGES: |
          @anthropic-ai/claude-code 2.1.153 sha512-QzkUc/2mfW9KTrSLULPJYRODexTZ3GPcLjRVivCJtff/495MJYy35597GTqlPBTvYPpGC2FOumy78LluWdphxA==
          @anthropic-ai/claude-code-darwin-arm64 2.1.153 sha512-ueSbEwkw57XYM7s4cWIJle9h8MEEl+lWM/Dw0Zu2txaWg9lWJUEcaCrYD5fMtdAwciIhO8Ebb08wQ3lnf5lXvg==
          @anthropic-ai/claude-code-darwin-x64 2.1.153 sha512-5acZ5CwlZIBy6w4y0cT/f+m8b9IU29xHR9+XhkVgyRHn38/ocwvn+GOrLBgAreyuPBFHMMGvnRH0eiRCUY8+3w==
          @anthropic-ai/claude-code-linux-arm64 2.1.153 sha512-brG/ZC4KMBHU8BlAoxwb/2wEgiBiZ5Glsl88EM3p63X3Ng8nwvyfsA8Ah2qdX4r6bszo2u7BeI9uxPlqyq1odg==
          @anthropic-ai/claude-code-linux-arm64-musl 2.1.153 sha512-Y/r0R2h+Ff30rl/8PHEN4s0N4Bksow8GhppkEz+cLsnWPZ8t41duMopc2Xx14SXyiUPoWzLQwR8i2UwVe9yqrA==
          @anthropic-ai/claude-code-linux-x64 2.1.153 sha512-Cw4ZG/08vSqZ0pVz0myR91uPV077lw1TYIEpef5cunrIFPZjSLWKR878vyzf51TTpeYPdHcvFuaUiiMz1GjZ7g==
          @anthropic-ai/claude-code-linux-x64-musl 2.1.153 sha512-DYT+S++QFbFHX1C4mH/g7G1csn5WFhz1zfA8cpQqlcnfqqwaR++KQFSQK68mpn06GeOu5IMSxjyHcGi1NoWDVg==
          @anthropic-ai/claude-code-win32-arm64 2.1.153 sha512-cDq6n4ECGoR5LmgR18xCKXvAvZrjzLgKmM0UdqkCRQnMFAbucFhjbGndLITPZBkfgWFZ9HeyUw5A1OElZzkJRw==
          @anthropic-ai/claude-code-win32-x64 2.1.153 sha512-JEk2MDB7xxkfVf64F8zMaCB8cjL43NrpfO0uiprryef/cXCPwwf2AsPCE+h68qxnvfxYuFvoJdLIjF/Ursy1ig==
      run: |
        set -euo pipefail
        dest="${RUNNER_TEMP}/claude-code"
        mkdir -p "$dest"
        cd "$dest"
        printf '{"private":true}\n' > package.json
        version=$(awk '$1 == "@anthropic-ai/claude-code" {print $2}' <<<"$PINNED_PACKAGES")
        test -n "$version"

        # Step 1: fetch without running any package script.
        npm install --ignore-scripts --no-audit --no-fund --save-exact \
          "@anthropic-ai/claude-code@${version}"

        # Step 2: every installed package must match a pinned hash.
        PINNED_PACKAGES="$PINNED_PACKAGES" python3 - <<'PY'
        import json, os, sys

        pins = {}
        for line in os.environ["PINNED_PACKAGES"].splitlines():
            if line.strip():
                name, version, integrity = line.split()
                pins[name] = (version, integrity)

        installed = json.load(open("node_modules/.package-lock.json"))["packages"]
        seen = set()
        for path, meta in installed.items():
            name = path.split("node_modules/", 1)[1]
            pin = pins.get(name)
            if pin is None:
                sys.exit(f"unpinned package installed: {name}")
            if (meta.get("version"), meta.get("integrity")) != pin:
                sys.exit(f"version or integrity mismatch: {name}")
            if not meta.get("resolved", "").startswith("https://registry.npmjs.org/"):
                sys.exit(f"unexpected download location: {name}")
            seen.add(name)
        if "@anthropic-ai/claude-code" not in seen:
            sys.exit("claude-code was not installed")
        print(f"verified {len(seen)} package(s) against pinned integrity hashes")
        PY

        # Step 3: only now run the install script that links the native binary.
        npm rebuild @anthropic-ai/claude-code --no-audit --no-fund
        echo "$dest/node_modules/.bin" >> "$GITHUB_PATH"
